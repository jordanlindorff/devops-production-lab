name: DevOps Production Lab CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app/app.py

      - name: Build Docker image
        run: docker build -t devops-production-lab-ci ./app

      - name: Start Docker container
        run: |
          docker run -d \
            --name devops-production-lab-ci \
            -p 5000:5000 \
            -e DATABASE_URL=postgresql://devops:devops_password@localhost:5432/devops_lab \
            devops-production-lab-ci

      - name: Verify Docker container is running
        run: |
          sleep 3
          docker ps
          docker inspect -f '{{.State.Running}}' devops-production-lab-ci | grep true

      - name: Stop test container
        if: always()
        run: docker rm -f devops-production-lab-ci

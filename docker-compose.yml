services:
  app:
    build:
      context: ./app
    container_name: devops-production-lab
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
